spring.application.name=BananaSkyRescueBackend

spring.datasource.url=jdbc:mysql://localhost:3306/banana_sky_rescue
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=8080

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax


# Email configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}

# SMTP security
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# SMTP connection timeout: 15 seconds
spring.mail.properties.mail.smtp.connectiontimeout=15000

# SMTP read timeout: 30 seconds
spring.mail.properties.mail.smtp.timeout=30000

# SMTP write timeout: 15 seconds
spring.mail.properties.mail.smtp.writetimeout=15000


logging.level.org.springframework.security=DEBUG
